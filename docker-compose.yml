services:

  mongodb:
    image: mongo:8
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      instagram-network:
        aliases:
          - mongodb

  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      instagram-network:
        aliases:
          - kafka

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: instagram-auth-service:latest
    container_name: instagram-auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/instagram_auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - instagram-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: instagram-user-service:latest
    container_name: instagram-user-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/instagram_users
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - instagram-network

  post-service:
    build:
      context: .
      dockerfile: post-service/Dockerfile
    image: instagram-post-service:latest
    container_name: instagram-post-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/instagram_posts
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - instagram-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: instagram-api-gateway:latest
    container_name: instagram-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      POST_SERVICE_URL: http://post-service:8083
    depends_on:
      - auth-service
      - user-service
      - post-service
    networks:
      - instagram-network

networks:
  instagram-network:
    driver: bridge

volumes:
  mongodb-data:
