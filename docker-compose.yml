services:

  # =========================
  # MongoDB
  # =========================
  mongodb:
    image: mongo:8
    container_name: instagram-mongodb
    ports:
      - "27017:27017"
    networks:
      - instagram-network


  # =========================
  # Kafka
  # =========================
  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    container_name: instagram-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - instagram-network


  # =========================
  # Auth Service
  # =========================
  auth-service:
    image: instagram-auth-service:latest
    container_name: instagram-auth-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/instagram_auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    depends_on:
      - mongodb
    networks:
      - instagram-network


  # =========================
  # User Service
  # =========================
  user-service:
    image: instagram-user-service:latest
    container_name: instagram-user-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/instagram_users
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mongodb
      - kafka
    networks:
      - instagram-network


  # =========================
  # Post Service
  # =========================
  post-service:
    image: instagram-post-service:latest
    container_name: instagram-post-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/instagram_posts
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_SERVICE_URL: http://user-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - mongodb
      - kafka
      - user-service
      - notification-service
    networks:
      - instagram-network


  # =========================
  # Notification Service
  # =========================
  notification-service:
    image: instagram-notification-service:latest
    container_name: instagram-notification-service
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/instagram_notifications
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mongodb
      - kafka
    networks:
      - instagram-network


  # =========================
  # API Gateway
  # =========================
  api-gateway:
    image: instagram-api-gateway:latest
    container_name: instagram-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      POST_SERVICE_URL: http://post-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - auth-service
      - user-service
      - post-service
      - notification-service
    networks:
      - instagram-network


# =========================
# Network
# =========================
networks:
  instagram-network:
    external: true