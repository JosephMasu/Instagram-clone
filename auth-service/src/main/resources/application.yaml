spring:
  application:
    name: auth-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/instagram_auth}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}