server:
  port: 8082

spring:
  application:
    name: user-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/instagram_users}
    auto-index-creation: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info