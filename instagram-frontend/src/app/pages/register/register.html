<div class="flex min-h-screen items-center justify-center bg-zinc-50 px-4">
  <div class="w-full max-w-[350px]">
    <div class="border border-zinc-200 bg-white px-10 pb-6 pt-10">
      <h1 class="font-logo mb-3 text-center text-5xl">Instagram</h1>
      <p class="mb-5 text-center text-sm font-semibold text-zinc-500">
        Sign up to see photos and videos from your friends.
      </p>
      <form class="flex flex-col gap-1.5" [formGroup]="form" (ngSubmit)="submit()">
        <input
          class="rounded-[3px] border border-zinc-200 bg-zinc-50 px-2 py-[9px] text-xs"
          placeholder="Mobile number or email"
          type="email"
          formControlName="email"
        />
        <input
          class="rounded-[3px] border border-zinc-200 bg-zinc-50 px-2 py-[9px] text-xs"
          placeholder="Full name"
          formControlName="fullName"
        />
        <input
          class="rounded-[3px] border border-zinc-200 bg-zinc-50 px-2 py-[9px] text-xs"
          placeholder="Username"
          formControlName="username"
        />
        <input
          class="rounded-[3px] border border-zinc-200 bg-zinc-50 px-2 py-[9px] text-xs"
          placeholder="Password"
          type="password"
          formControlName="password"
        />
        @if (error()) {
          <p class="pt-2 text-center text-sm text-red-500">{{ error() }}</p>
        }
        <button
          class="mt-3 rounded-lg bg-[#0095F6] py-[7px] text-sm font-semibold text-white disabled:opacity-40"
          type="submit"
          [disabled]="pending()"
        >
          Sign up
        </button>
      </form>
    </div>
    <div class="mt-2.5 border border-zinc-200 bg-white py-5 text-center text-sm">
      Have an account?
      <a class="font-semibold text-[#0095F6]" routerLink="/login">Log in</a>
    </div>
  </div>
</div>
