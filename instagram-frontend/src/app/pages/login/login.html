<div class="flex min-h-screen items-center justify-center bg-zinc-50 px-4">
  <div class="w-full max-w-[350px]">
    <div class="border border-zinc-200 bg-white px-10 pb-6 pt-10">
      <h1 class="font-logo mb-8 text-center text-5xl">Instagram</h1>
      <form class="flex flex-col gap-1.5" [formGroup]="form" (ngSubmit)="submit()">
        <input
          class="rounded-[3px] border border-zinc-200 bg-zinc-50 px-2 py-[9px] text-xs"
          type="email"
          placeholder="Phone number, username, or email"
          formControlName="email"
        />
        <input
          class="rounded-[3px] border border-zinc-200 bg-zinc-50 px-2 py-[9px] text-xs"
          type="password"
          placeholder="Password"
          formControlName="password"
        />
        @if (error()) {
          <p class="pt-2 text-center text-sm text-red-500">{{ error() }}</p>
        }
        <button
          class="mt-3 rounded-lg bg-[#0095F6] py-[7px] text-sm font-semibold text-white disabled:opacity-40"
          type="submit"
          [disabled]="pending()"
        >
          Log in
        </button>
      </form>
      <div class="my-4 flex items-center gap-4">
        <span class="h-px flex-1 bg-zinc-200"></span>
        <span class="text-xs font-semibold text-zinc-500">OR</span>
        <span class="h-px flex-1 bg-zinc-200"></span>
      </div>
      <p class="text-center text-xs text-zinc-500">Forgot password?</p>
    </div>
    <div class="mt-2.5 border border-zinc-200 bg-white py-5 text-center text-sm">
      Don't have an account?
      <a class="font-semibold text-[#0095F6]" routerLink="/register">Sign up</a>
    </div>
  </div>
</div>
