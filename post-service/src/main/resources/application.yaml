server:
  port: 8083

spring:
  application:
    name: post-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/instagram_posts}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info